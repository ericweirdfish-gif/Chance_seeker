<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chance Seeker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>Chance Seeker</h1>
      <span class="sub">链上资金 × X 注意力</span>
    </div>
    <div class="controls">
      <label>最低分
        <input id="minScore" type="number" value="0" min="0" max="100" step="5">
      </label>
      <label class="check">
        <input id="onlyAlerted" type="checkbox"> 只看已告警
      </label>
      <button id="refresh">刷新</button>
      <span id="updated" class="updated"></span>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <main>
    <table id="table">
      <thead>
        <tr>
          <th class="num">分数</th>
          <th>标的</th>
          <th>链</th>
          <th class="num">资金</th>
          <th class="num">注意力</th>
          <th class="num">风险</th>
          <th>触发信号</th>
          <th class="num">时间</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>还没有数据。先跑 <code>chance-seeker once</code> 或 <code>chance-seeker demo</code>。</p>
  </main>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button id="drawerClose">×</button>
    </div>
    <div id="drawerBody"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
