name: Monitor

# 定时监控。开跑之前先搞清楚三件事：
#
# 1) schedule 只在【默认分支】触发。这个工作流不合并到 main 就永远不会自动跑。
#
# 2) 额度。本仓库是【公开】的，Actions 分钟数不限，所以频率按数据源限流来定，
#    而不是按额度。实测整个 job 约 12 秒。
#      每 10 分钟 → 每天 144 次       ← 默认，对新 meme 币够用
#      每 5 分钟  → GitHub 允许的最快 cron，但高峰期本来就会延迟到 10 分钟以上
#    注意：如果仓库改回私有，免费额度只有 2000 分钟/月，按 job 向上取整计费，
#    这个频率每月约 4400 分钟会直接超额，必须改回 */30。
#
# 3) 每次运行都是全新容器，靠 actions/cache 把 SQLite 带到下一次。
#    没有缓存就没有历史基线，统计类规则永远不会触发。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: 日志级别
        required: false
        default: INFO
        type: choice
        options: [INFO, DEBUG]

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # 用 requirements.txt 而不是 `pip install -e .`：跳过构建 wheel，
      # 配合 pip 缓存实测 2 秒装完
      - name: 安装依赖
        run: pip install -r requirements.txt --quiet

      # key 每次都不同（缓存条目不可变，必须换 key 才能写入），
      # restore-keys 用前缀匹配捞回上一次的库
      - name: 取回上一次的数据库
        uses: actions/cache@v4
        with:
          path: data
          key: chance-seeker-db-${{ github.run_id }}
          restore-keys: |
            chance-seeker-db-

      - name: 准备配置
        run: |
          mkdir -p data
          cp config/config.example.yaml config/config.yaml

      - name: 跑一轮
        env:
          X_PROVIDER: ${{ secrets.X_PROVIDER }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m chance_seeker --log-level "${{ inputs.log_level || 'INFO' }}" once

      # 缓存条目要占仓库 10GB 配额，任由数据库长大迟早会把 pip 缓存挤掉。
      # 压缩前先把过期指标点清掉，并汇报体积。
      - name: 压实数据库
        run: |
          python -m chance_seeker prune --vacuum
          echo "数据库体积: $(du -h data/chance.db | cut -f1)"

      # 没配推送凭证的话，工具会照常跑、照常算分，但你什么都收不到。
      # 这一步把渠道状态写进日志，免得以为在跑其实是个哑巴。
      - name: 检查推送渠道
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          missing=""
          [ -z "$TELEGRAM_BOT_TOKEN" ] && missing="$missing TELEGRAM_BOT_TOKEN"
          [ -z "$TELEGRAM_CHAT_ID" ]   && missing="$missing TELEGRAM_CHAT_ID"
          [ -z "$DISCORD_WEBHOOK_URL" ] && missing="$missing DISCORD_WEBHOOK_URL"
          if [ -n "$TELEGRAM_BOT_TOKEN" ] || [ -n "$DISCORD_WEBHOOK_URL" ]; then
            echo "✅ 已配置推送渠道"
          else
            echo "::warning::没有配置任何推送渠道，信号只会留在数据库和下面的运行摘要里。"
            echo "在 仓库 Settings → Secrets and variables → Actions 添加："
            echo "  TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID，或 DISCORD_WEBHOOK_URL"
          fi
          [ -n "$missing" ] && echo "未设置的 Secret:$missing" || true

      - name: 写入运行摘要
        if: always()
        run: |
          {
            echo "### Chance Seeker"
            echo ""
            python -m chance_seeker stats 2>/dev/null || echo "（统计不可用）"
            echo ""
            echo "近期机会："
            echo '```'
            python -m chance_seeker top --top 10 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
